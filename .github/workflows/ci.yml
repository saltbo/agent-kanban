name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

  test:
    name: test (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: toolbox-http
            command: pnpm exec vitest run --project integration-http tests/integration/http/toolbox-generic-agent-operations.test.ts
          - suite: other-http
            command: pnpm exec vitest run --project integration-http --exclude tests/integration/http/toolbox-generic-agent-operations.test.ts
          - suite: migrations
            command: pnpm exec vitest run --project integration-migrations
          - suite: core
            command: pnpm exec vitest run --project unit-domain --project unit-application --project unit-component --project integration-adapters --project contract-http --project legacy
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.command }}
